services:
  - type: web
    name: cm-controle-validade
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cm_validade
      - key: APP_USERNAME
        value: funcionarios
      - key: APP_PASSWORD
        sync: false
